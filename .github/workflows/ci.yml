name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "dl/portunus-*"

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  format:
    uses: ./.github/workflows/format.yml
  type-check:
    uses: ./.github/workflows/type-check.yml
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
