[project]
name = "portunus"
dynamic = ["version"]
description = ""
authors = [{ name = "Tom.Catling", email = "Tom.Catling@dsit.gov.uk" }]
requires-python = "~=3.12"
dependencies = [
    "fastapi>=0.111.0,<1",
    "gunicorn>=22.0.0,<23",
    "cryptography>=43.0.0,<50",
    "httpx>=0.27.0,<1",
    "rsa~=4.9",
    "boto3>=1.34.144,<2",
    "aiobotocore>=2.13.0,<3",
    "pyyaml>=6.0.1,<7",
    "redis>=5.0.0,<6",
    "hiredis>=3.3.0,<4",
    "async-timeout>=4.0.3,<5",
    # gRPC servers for Envoy ext_authz / ext_proc filters. xds-protos>=1.80
    # ships the stable v3 namespace (older versions only have v3alpha).
    # grpcio, its health/reflection packages and xds-protos are held on the
    # 1.82 line. The floor is 1.82.2: 1.82.1 is affected by GHSA-hf3w-6hpw-qp67
    # (gRPC core heap exhaustion: unbounded decompression, GOAWAY parsing),
    # patched in 1.82.2 and 1.83.1. The <1.83 cap stays: 1.84 lowered sustained
    # throughput by ~13-20% at saturation in a same-node A/B load test (CPU per
    # request unchanged below saturation), and an A/B in the production
    # topology confirmed the regression: audit falls behind under mixed load.
    "grpcio>=1.82.2,<1.83",
    "xds-protos>=1.82.2,<1.83",
    "googleapis-common-protos>=1.65.0,<2",
    "contextvars~=2.4",
    # Pinned to the 16.x major: the relay uses the websockets.asyncio client
    # API, which has churned across majors, and CI only exercises the locked
    # 16.x line. (The asyncio API was introduced in 13.0; 12.x lacks it.)
    "websockets>=16,<17",
    # <0.47: uvicorn 0.47.0 imports the ASGI app before the serving event loop
    # exists (encode/uvicorn#2919), which broke X-Ray trace propagation
    # (2026-07-02 outage). X-Ray is gone; the pin stays until the REST service
    # is retired rather than taking a server upgrade alongside this change.
    # uvicorn is ignored in .github/dependabot.yml so it isn't bumped
    # automatically — update that ignore rule if this pin changes.
    "uvicorn>=0.29.0,<0.47",
    # Standard gRPC health checking (grpc.health.v1.Health) for the ECS /
    # ALB health probe, and server reflection so operators can introspect
    # the served services without a local .proto copy. protobuf itself is
    # pinned transitively by xds-protos (>=6.31); we don't pin it here to
    # avoid fighting that constraint.
    "grpcio-health-checking>=1.82.2,<1.83",
    "grpcio-reflection>=1.82.2,<1.83",
    # orjson on the publish hot path — every audit record goes through
    # ``orjson.dumps``.
    "orjson>=3.10.0,<4",
    # wsproto: sans-IO WebSocket frame parsing in the ext_proc Process
    # service. ``FrameObserver`` wraps ``wsproto.Connection`` to recover
    # logical text/binary/close frames from post-101 byte chunks.
    "wsproto>=1.2.0,<2",
    # Brotli: ``Content-Encoding: br`` decode branch in models.py — several
    # providers brotli-compress response bodies; without it token accounting
    # silently fails for them.
    "Brotli>=1.1.0,<2",
    "uvloop>=0.22.1,<1; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation == 'CPython'",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "ruff>=0.16.2,<1",
    "boto3-stubs[secretsmanager, logs]>=1.43.47,<2",
    "types-pyyaml>=6.0.12.20240724,<7",
    "moto>=5.1.13,<6",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "fakeredis>=2.26.0,<3",
    "freezegun>=1.5.0,<2",
]

[project.scripts]
portunus = "portunus.cli:main"
# Process entrypoint for the gRPC server. Used by the container CMD.
portunus-server = "portunus.grpc.server:main"

[tool.hatch.build.targets.sdist]
packages = ["portunus"]

[tool.hatch.build.targets.wheel]
packages = ["portunus"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", local_scheme = "no-local-version" }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E",   # pycodestyle errors
          "W",   # pycodestyle warnings
          "F",   # flake8
          "D",   # pydocstyle
          "I",   # isort
        ]
ignore = ["E203", "D10", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]

[[tool.mypy.overrides]]
# Third-party gRPC / protobuf / boto packages ship without type stubs (or
# only partial ones).
module = [
    "brotli",
    "grpc",
    "grpc.*",
    "grpc_health.*",
    "grpc_reflection.*",
    "google.protobuf.*",
    "google.rpc.*",
    "aiobotocore",
    "aiobotocore.*",
    "envoy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (requiring Docker, network, etc.)",
    "disruption: destructive e2e tests that kill/restart containers (run serially)",
]
